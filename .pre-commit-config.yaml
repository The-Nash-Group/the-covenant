repos:
  - repo: local
    hooks:
      - id: validate-structure
        name: Check structure when parent tooling is available
        entry: scripts/run-parent-validator.sh validate-repo-structure.sh
        language: system
        pass_filenames: false
        verbose: true

      - id: validate-naming
        name: Check naming when parent tooling is available
        entry: scripts/run-parent-validator.sh validate-naming.sh
        language: system
        pass_filenames: false
        verbose: true

      - id: check-secrets
        name: Check secrets when parent tooling is available
        entry: scripts/run-parent-validator.sh check-secrets.sh
        language: system
        pass_filenames: false
        verbose: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
