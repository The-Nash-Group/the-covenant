# the-covenant/.github/suborgs/platform-clan.yml
suborgrepos:
  - "service-*"

teams:
  - name: mentors
    permission: write

branch_protection:
  - name: default
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 2
        require_code_owner_reviews: true
        dismiss_stale_reviews: true
      enforce_admins: true
      required_status_checks:
        strict: true
        contexts:
          - "ci"
          - "lint"
      restrictions: null